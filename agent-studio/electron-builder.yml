appId: com.abhayditya.agentstudio
productName: Agent Studio
copyright: © Abhayditya Singh
directories:
  output: dist
  buildResources: resources
publish:
  provider: github
  owner: AbhaydityaPratapSingh
  repo: claude-agent-toolkit
files:
  - out/**/*
  - package.json
win:
  icon: resources/icon.ico
  # Without a real certificate electron-builder produces an unsigned binary and
  # SmartScreen warns on first run. Set CSC_LINK + CSC_KEY_PASSWORD to sign.
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
mac:
  category: public.app-category.developer-tools
  # No Apple Developer ID on the CI runner that builds this — ad-hoc/unsigned.
  # Gatekeeper will warn on first open (right-click > Open, or `xattr -cr`).
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agent Studio
  artifactName: ${productName} Setup ${version}.${ext}
portable:
  artifactName: ${productName} ${version} portable.${ext}
