name: Release Agent Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v1.0.0) — only needed for a manual re-run"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Publish Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "${TAG}-win" dist/*.exe \
            --repo "${{ github.repository }}" \
            --title "Agent Studio ${TAG} (Windows)" \
            --notes "Windows build of Agent Studio ${TAG}. Unsigned — SmartScreen may warn on first run (More info > Run anyway)." \
            || gh release upload "${TAG}-win" dist/*.exe --repo "${{ github.repository }}" --clobber

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "${TAG}-mac" dist/*.dmg dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Agent Studio ${TAG} (macOS)" \
            --notes "macOS build of Agent Studio ${TAG}. Unsigned/not notarized — Gatekeeper will block it; right-click the app > Open, or run: xattr -cr \"/Applications/Agent Studio.app\"" \
            || gh release upload "${TAG}-mac" dist/*.dmg dist/*.zip --repo "${{ github.repository }}" --clobber
